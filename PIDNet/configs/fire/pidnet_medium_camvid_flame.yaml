CUDNN:
  BENCHMARK: true
  DETERMINISTIC: false
  ENABLED: true

GPUS: (0,)
OUTPUT_DIR: 'output/fire/cbam/seed76'
LOG_DIR: 'log/fire/cbam/seed76'
WORKERS: 3
PRINT_FREQ: 10

DATASET:
  DATASET: camvid  # still using the CamVid loader
  ROOT: datasets/fire/
  TRAIN_SET: train.txt
  TEST_SET: val.txt
  NUM_CLASSES: 2

MODEL:
  NAME: pidnet_m
  NUM_OUTPUTS: 2
  PRETRAINED: pretrained_models/camvid/camvidPretainedMedium.pt
  ALIGN_CORNERS: true

LOSS:
  USE_OHEM: true
  OHEMTHRES: 0.9
  OHEMKEEP: 131072
  BALANCE_WEIGHTS: [0.3, 0.7]  # increased fire weight
  SB_WEIGHTS: 1.0

TRAIN:
  IMAGE_SIZE: [600, 800]
  BASE_SIZE: 600
  BATCH_SIZE_PER_GPU: 6
  SHUFFLE: true
  BEGIN_EPOCH: 0
  END_EPOCH: 200
  RESUME: false
  OPTIMIZER: sgd
  LR: 0.0055
  WD: 0.0005
  MOMENTUM: 0.9
  NESTEROV: false
  FLIP: true
  MULTI_SCALE: true
  IGNORE_LABEL: 255
  SCALE_FACTOR: 16

TEST:
  IMAGE_SIZE: [600,800]
  BASE_SIZE: 600
  BATCH_SIZE_PER_GPU: 1
  FLIP_TEST: false
  MULTI_SCALE: false
  MODEL_FILE: 'output/fire/cbam/seed76/train/best.pt'
  OUTPUT_INDEX: 1

